<svg width="360" height="300" viewBox="0 0 360 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Arms -->
    <line x1="150" y1="150" x2="60" y2="90" />
    <line x1="150" y1="150" x2="60" y2="210" />
    <line x1="210" y1="150" x2="300" y2="90" />
    <line x1="210" y1="150" x2="300" y2="210" />

    <!-- Motor housings -->
    <rect x="48" y="80" width="24" height="16" rx="4" fill="#e2e8f0" />
    <rect x="48" y="204" width="24" height="16" rx="4" fill="#e2e8f0" />
    <rect x="288" y="80" width="24" height="16" rx="4" fill="#e2e8f0" />
    <rect x="288" y="204" width="24" height="16" rx="4" fill="#e2e8f0" />

    <!-- Propellers -->
    <ellipse cx="60" cy="70" rx="38" ry="6" fill="#cbd5e1" stroke="none" />
    <ellipse cx="60" cy="70" rx="6" ry="38" fill="none" />
    <ellipse cx="60" cy="230" rx="38" ry="6" fill="#cbd5e1" stroke="none" />
    <ellipse cx="60" cy="230" rx="6" ry="38" fill="none" />
    <ellipse cx="300" cy="70" rx="38" ry="6" fill="#cbd5e1" stroke="none" />
    <ellipse cx="300" cy="70" rx="6" ry="38" fill="none" />
    <ellipse cx="300" cy="230" rx="38" ry="6" fill="#cbd5e1" stroke="none" />
    <ellipse cx="300" cy="230" rx="6" ry="38" fill="none" />

    <!-- Body -->
    <rect x="128" y="128" width="104" height="52" rx="14" fill="#f1f5f9" />
    <rect x="150" y="118" width="60" height="22" rx="8" fill="#e2e8f0" />

    <!-- Gimbal / camera -->
    <path d="M170 180 v18 a10 10 0 0 0 10 10 h20 a10 10 0 0 0 10 -10 v-18 z" fill="#e2e8f0" />
    <circle cx="180" cy="198" r="6" fill="#94a3b8" />

    <!-- Legs -->
    <line x1="150" y1="180" x2="146" y2="204" />
    <line x1="210" y1="180" x2="214" y2="204" />

    <!-- Front sensors -->
    <circle cx="196" cy="128" r="4" fill="#38bdf8" stroke="none" />
  </g>
</svg>
