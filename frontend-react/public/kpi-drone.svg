<svg width="200" height="140" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(70,10)" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Arms -->
    <line x1="55" y1="55" x2="20" y2="30" />
    <line x1="55" y1="55" x2="20" y2="80" />
    <line x1="85" y1="55" x2="120" y2="30" />
    <line x1="85" y1="55" x2="120" y2="80" />
    <!-- Propellers -->
    <ellipse cx="16" cy="24" rx="16" ry="3.2" fill="#cbd5e1" stroke="none" />
    <ellipse cx="16" cy="86" rx="16" ry="3.2" fill="#cbd5e1" stroke="none" />
    <ellipse cx="124" cy="24" rx="16" ry="3.2" fill="#cbd5e1" stroke="none" />
    <ellipse cx="124" cy="86" rx="16" ry="3.2" fill="#cbd5e1" stroke="none" />
    <!-- Body -->
    <rect x="48" y="46" width="44" height="22" rx="7" fill="#f1f5f9" />
    <rect x="58" y="40" width="24" height="10" rx="4" fill="#e2e8f0" />
    <!-- Gimbal -->
    <path d="M62 68 v6 a5 5 0 0 0 5 5 h6 a5 5 0 0 0 5 -5 v-6 z" fill="#e2e8f0" />
